<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание заявки</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <section class="nav">
                <img class="nav__logo" src="Photo/logo.png" alt="Logo">
                <ul class="nav__list">
                    <li><a class="nav__link" href="index.html">Главная</a></li>
                    <li><a class="nav__link" href="index.html#order">Услуги</a></li>
                    <li><a class="nav__link" href="create.html">Cоздать заявку</a></li>
                    <li><a class="nav__link" href="orders.html">Заявки</a></li>
                </ul>
                <div class="auth">
                    <button onclick="window.location.href='login.html'" class="auth__btn auth__btn--login">Вход</button>
                    <button onclick="window.location.href='register.html'" class="auth__btn auth__btn--register">Регистрация</button>
                </div>
            </section>
        </nav>
    </header>

    <main class="create-order">
        <div class="create-order__title">
            <h1>Создание заявки</h1>
            <p>Заполните форму, чтобы заказать уборку</p>
        </div>

        <form class="create-order__form">
            <div class="create-order__field">
                <label for="service">Вид уборки</label>
                <select id="service" name="service" required>
                    <option value="">Выберите услугу</option>
                    <option value="general">Генеральная уборка</option>
                    <option value="maintenance">Поддерживающая уборка</option>
                    <option value="after-repair">Уборка после ремонта</option>
                    <option value="windows">Мойка окон</option>
                </select>
            </div>

            <div class="create-order__field">
                <label for="date">Дата уборки</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="create-order__field">
                <label for="time">Время уборки</label>
                <select id="time" name="time" required>
                    <option value="">Выберите время</option>
                    <option value="09:00">09:00</option>
                    <option value="12:00">12:00</option>
                    <option value="15:00">15:00</option>
                    <option value="18:00">18:00</option>
                </select>
            </div>

            <div class="create-order__field">
                <label for="address">Адрес уборки</label>
                <input type="text" id="address" name="address" placeholder="Улица, дом, квартира" required>
            </div>

            <div class="create-order__field">
                <label for="area">Площадь помещения, м²</label>
                <input type="number" id="area" name="area" min="1" placeholder="Например, 60" required>
            </div>

            <div class="create-order__field">
                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__" required>
            </div>

            <div class="create-order__field create-order__field--big">
                <label for="comment">Комментарий к заявке</label>
                <textarea id="comment" name="comment" rows="4" placeholder="Дополнительные пожелания (необязательно)"></textarea>
            </div>

            <button type="submit" class="create-order__btn">Оформить заявку</button>
        </form>
    </main>

    <footer>
        <div class="site-footer">
            <img class="site-footer__logo" src="Photo/footer-logo.png" alt="Logo">
            <ul class="site-footer__list">
                <li><a class="site-footer__link" href="index.html">Главная</a></li>
                <li><a class="site-footer__link" href="index.html#order">Услуги</a></li>
                <li><a class="site-footer__link" href="create.html">Cоздать заявку</a></li>
                <li><a class="site-footer__link" href="orders.html">Заявки</a></li>
            </ul>
            <div class="link">
                <a href="https://vk.ru/ossatov">
                    <img class="site-footer__photo" src="Photo/vk.png" alt="VK">
                </a>
                <a href="https://vk.ru/ossatov">
                    <img class="site-footer__photo" src="Photo/tg.png" alt="TG">
                </a>
            </div>
        </div>
        <h3 class="site-footer__end">Данный проект выполнен в учебных целях Кукшинским Ратмиром, студентом группы 9-ИС303</h3>
    </footer>
</body>
</html>
